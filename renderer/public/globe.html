<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The globe's own page. CesiumJS builds its widgets at run time with new Function and decodes meshes with WebAssembly,
         so this page (and only this page) allows both. It holds nothing but the bundled Cesium and globe.js, has no access to
         the app's bridge (preload scripts are not injected into frames), and talks to the app by postMessage alone. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self' data:; connect-src 'self' https: data: blob:" />
    <title>Globe</title>
    <link rel="stylesheet" href="./cesium/Widgets/widgets.css" />
    <style>html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05060a; }</style>
  </head>
  <body>
    <div id="map"></div>
    <script src="./cesium/Cesium.js"></script>
    <script src="./globe.js"></script>
  </body>
</html>
